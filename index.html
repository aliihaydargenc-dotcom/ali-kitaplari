<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ali Haydar Genç çocuk kitapları dijital kütüphanesi">
  <title>Ali Haydar Genç | Çocuk Kitapları</title>
  <style>
    :root{
      --bg:#f6f0e6;
      --card:#fffdf9;
      --text:#24303a;
      --muted:#6f7780;
      --accent:#3567d6;
      --accent-hover:#2856bb;
      --border:#e7ded1;
      --shadow:0 12px 28px rgba(43,36,28,.09);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fbf8f2 0%,var(--bg) 100%);color:var(--text)}
    header{max-width:1180px;margin:0 auto;padding:56px 22px 30px;text-align:center}
    .eyebrow{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
    h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.035em}
    header .subtitle{max-width:620px;margin:16px auto 0;color:var(--muted);line-height:1.6}
    main{max-width:1180px;margin:0 auto;padding:18px 22px 56px}
    .count{margin:0 0 18px;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
    .card{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(43,36,28,.13)}
    .cover-wrap{background:#eee5d8;aspect-ratio:4/5;overflow:hidden}
    .cover{display:block;width:100%;height:100%;object-fit:cover}
    .content{display:flex;flex:1;flex-direction:column;padding:17px}
    h2{margin:0;font-size:18px;line-height:1.35}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:auto;padding-top:18px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:42px;padding:9px 10px;border-radius:11px;text-decoration:none;font-size:13px;font-weight:800;transition:background .15s ease,transform .15s ease}
    .btn:active{transform:scale(.98)}
    .primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent-hover)}
    .secondary{background:#edf2fc;color:#315daf}
    footer{padding:8px 20px 34px;text-align:center;color:var(--muted);font-size:13px}
    @media (max-width:520px){header{padding-top:38px}main{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr 1fr;gap:12px}.content{padding:12px}h2{font-size:15px}.actions{grid-template-columns:1fr;padding-top:13px}.btn{font-size:12px;min-height:38px}}
    @media (max-width:360px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Dijital Kütüphane</p>
    <h1>Çocuk Kitapları</h1>
    <p class="subtitle">Ali Haydar Genç tarafından hazırlanan çocuk kitaplarını Android, iPhone ve bilgisayarda çevrim içi okuyabilir veya PDF olarak indirebilirsiniz.</p>
  </header>

  <main>
    <p class="count" id="bookCount"></p>
    <section class="grid" id="bookGrid" aria-label="Kitaplar"></section>
  </main>

  <footer>© 2026 Ali Haydar Genç</footer>

  <script>
    const books = [
      ["Ali ile Annesinin Deniz Pikniği", "Ali_ile_Annesinin_Deniz_Piknigi"],
      ["Ali ile Annesinin Park Günü", "Ali_ile_Annesinin_Park_Gunu"],
      ["Ali ile Babası Birlikte Bahçe Yapıyor", "Ali_ile_Babasi_Birlikte_Bahce_Yapiyor"],
      ["Ali ile Babası Bisiklete Binmeye Gidiyor", "Ali_ile_Babasi_Bisiklete_Binmeye_Gidiyor"],
      ["Ali ile Babası Eski Fotoğraflara Bakıyor", "Ali_ile_Babasi_Eski_Fotograflara_Bakiyor"],
      ["Ali ile Babası Mutfakta Kurabiye Yapıyor", "Ali_ile_Babasi_Mutfakta_Kurabiye_Yapiyor"],
      ["Ali ile Babası Uçakları İzlemeye Gidiyor", "Ali_ile_Babasi_Ucaklari_Izlemeye_Gidiyor"],
      ["Ali ile Babasıyla Balık Tutmaya Gidiyor", "Ali_ile_Babasiyla_Balik_Tutmaya_Gidiyor"],
      ["Ali ile Babasıyla Kamp Yapmaya Gidiyor", "Ali_ile_Babasiyla_Kamp_Yapmaya_Gidiyor"],
      ["Ali ve Kaybolan Kırmızı Top", "Ali_ve_Kaybolan_Kirmizi_Top"],
      ["Ali ve Rüzgara Takılan Uçurtma", "Ali_ve_Ruzgara_Takilan_Ucurtma"],
      ["Ali ve Yağmurlu Gün Macerası", "Ali_ve_Yagmurlu_Gun_Macerasi"],
      ["Ali ve Yıldız Kurabiyeler", "Ali_ve_Yildiz_Kurabiyeler"]
    ];

    const grid = document.getElementById("bookGrid");
    document.getElementById("bookCount").textContent = `${books.length} kitap`;

    for (const [title, file] of books) {
      const readerUrl = `reader.html?file=${encodeURIComponent(file + '.pdf')}&title=${encodeURIComponent(title)}`;
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="cover-wrap">
          <img class="cover" src="kapaklar/${file}.jpg" alt="${title} kapağı" loading="lazy">
        </div>
        <div class="content">
          <h2>${title}</h2>
          <div class="actions">
            <a class="btn primary" href="${readerUrl}">Kitabı Oku</a>
            <a class="btn secondary" href="pdf/${file}.pdf" download>PDF İndir</a>
          </div>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
